# Starship prompt configuration
# https://starship.rs/config/

command_timeout = 1000

# Single line: directory + git branch, then prompt on new line
format = """
$python$directory$git_branch$git_status
$character"""

[directory]
truncation_length = 4
truncate_to_repo = false
style = "bold cyan"
read_only = " "

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
# Compact single-symbol markers instead of word counts, so the prompt stays calm.
# Symbols stack only when multiple states apply (e.g. "*?" = modified + untracked).
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "$"
modified = "*"
staged = "+"
renamed = "»"
deleted = "✘"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold cyan)"

[python]
format = '([(\($virtualenv\))]($style) )'

